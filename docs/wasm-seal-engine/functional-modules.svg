<svg width="100%" viewBox="0 0 680 470" role="img">
  <title>dianjureader.wasm 引擎功能模块（由 wasm 数据段 316 个 Embind 注册字符串归纳）</title>
  <desc>从 wasm 反编译字符串证据还原出的引擎内部功能模块：Qt GUI 框架、文档渲染、印章、数字签名与密码、文件IO、云签/UKey、打印、DI 注入、元数据文本、坐标转换。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .box rect { fill:#F1EFE8; stroke:#5F5E5A; }
    .th { font-family:sans-serif; font-weight:500; font-size:14px; fill:#2C2C2A; }
    .ts { font-family:sans-serif; font-weight:400; font-size:13px; fill:#5F5E5A; }
    .c-blue rect { fill:#E6F1FB; stroke:#185FA5; stroke-width:0.5; }
    .c-teal rect { fill:#E1F5EE; stroke:#0F6E56; stroke-width:0.5; }
  </style>

  <g class="box">
