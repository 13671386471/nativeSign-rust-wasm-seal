    <text class="ts" x="60" y="88" text-anchor="start">由 wasm 数据段 316 个 Embind 注册字符串归纳；Export 段仅 33 个运行时原语（API 经 Embind 动态注册）</text>
  </g>

  <g class="c-blue">
