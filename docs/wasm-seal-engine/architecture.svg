<svg width="100%" viewBox="0 0 680 560" role="img">
  <title>点聚 C++/Qt WASM 签章引擎架构与调用链</title>
  <desc>从 Vue 组件经 JS 桥、Qt WASM 运行时到底层 C++/Qt 引擎，以及 DI_* 依赖注入与浏览器能力的分层结构。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .box rect { fill:#F1EFE8; stroke:#5F5E5A; }
    .th { font-family:sans-serif; font-weight:500; font-size:14px; fill:#2C2C2A; }
    .ts { font-family:sans-serif; font-weight:400; font-size:13px; fill:#5F5E5A; }
    .c-blue rect { fill:#E6F1FB; stroke:#185FA5; stroke-width:0.5; }
    .c-teal rect { fill:#E1F5EE; stroke:#0F6E56; stroke-width:0.5; }
  </style>

  <text class="th" x="340" y="28" text-anchor="middle">点聚 C++/Qt WASM 签章引擎 · 架构与调用链</text>

  <g class="box">
    <rect x="90" y="50" width="500" height="58" rx="10" stroke-width="0.5"/>
    <text class="th" x="340" y="72" text-anchor="middle">Vue 应用层</text>
    <text class="ts" x="340" y="92" text-anchor="middle">index.vue · 全局桥对象 OFD_Plugin.*</text>
  </g>
  <line class="arr" x1="340" y1="108" x2="340" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="box">
    <rect x="90" y="128" width="500" height="58" rx="10" stroke-width="0.5"/>
    <text class="th" x="340" y="150" text-anchor="middle">JS 桥接层 · ofd_plugin.js</text>
    <text class="ts" x="340" y="170" text-anchor="middle">HWPostil Proxy · DJDR_ 同步 / 其余自动 Promise→C++ vResolve</text>
  </g>
  <line class="arr" x1="340" y1="186" x2="340" y2="204" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="box">
    <rect x="90" y="206" width="500" height="58" rx="10" stroke-width="0.5"/>
    <text class="th" x="340" y="228" text-anchor="middle">Qt WASM 运行时 · qtloader.js</text>
    <text class="ts" x="340" y="248" text-anchor="middle">© Qt Company · Emscripten 胶水 dianjureader.js (entryFunction)</text>
  </g>
  <line class="arr" x1="340" y1="264" x2="340" y2="282" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="90" y="284" width="500" height="80" rx="10" stroke-width="0.5"/>
    <text class="th" x="340" y="306" text-anchor="middle">C++/Qt 签章引擎 · dianjureader.wasm (31MB)</text>
    <text class="ts" x="340" y="328" text-anchor="middle">暴露 OFD_ReaderWASM 对象</text>
    <text class="ts" x="340" y="348" text-anchor="middle">PDF/OFD 解析 · 渲染 · 签章 · 签名 · 转版</text>
  </g>
  <line class="arr" x1="340" y1="364" x2="340" y2="382" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="box">
    <rect x="55" y="384" width="570" height="74" rx="12" stroke-width="0.5"/>
    <text class="ts" x="68" y="400" text-anchor="start">DI_* 依赖注入：C++ 抽象接口，由 JS 侧实现并注入引擎</text>
    <g class="c-teal">
      <rect x="70" y="408" width="120" height="40" rx="8" stroke-width="0.5"/>
      <text class="th" x="130" y="424" text-anchor="middle">DI_FileOpen</text>
      <text class="ts" x="130" y="440" text-anchor="middle">打开文件</text>
    </g>
    <g class="c-teal">
      <rect x="208" y="408" width="120" height="40" rx="8" stroke-width="0.5"/>
      <text class="th" x="268" y="424" text-anchor="middle">DI_FileSave</text>
      <text class="ts" x="268" y="440" text-anchor="middle">保存文件</text>
    </g>
    <g class="c-teal">
      <rect x="346" y="408" width="120" height="40" rx="8" stroke-width="0.5"/>
      <text class="th" x="406" y="424" text-anchor="middle">DI_IndexDB</text>
      <text class="ts" x="406" y="440" text-anchor="middle">本地持久化</text>
    </g>
    <g class="c-teal">
      <rect x="484" y="408" width="120" height="40" rx="8" stroke-width="0.5"/>
      <text class="th" x="544" y="424" text-anchor="middle">DI_FetchDRC</text>
      <text class="ts" x="544" y="440" text-anchor="middle">印章/字体/转版</text>
    </g>
  </g>
  <line class="arr" x1="340" y1="458" x2="340" y2="478" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="box">
    <rect x="90" y="480" width="500" height="58" rx="10" stroke-width="0.5"/>
    <text class="th" x="340" y="502" text-anchor="middle">浏览器运行时</text>
    <text class="ts" x="340" y="522" text-anchor="middle">#screen canvas · IndexedDB · 文件对话框 · 字体 / DCS 网络</text>
  </g>
</svg>
